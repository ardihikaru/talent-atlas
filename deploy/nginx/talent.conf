# Talent Atlas — public edge vhost. REFERENCE COPY.
#
# The live file is /etc/nginx/conf.d/talent.conf on `clino` (ssh clino), and clino is
# the source of truth. Keep this copy in step by hand after any edit there.
#
# PORT SLOT. The shared register is 1<environment><product><instance>: 18xxx prod,
# 19xxx dev. All ten single-digit product slots are taken (00 saas, 01 clino, 02 cubiq,
# 03 gaos, 04 pustaka, 05 jagara, 06 animora, 07 satu-pharma, 08 wa, 09 opengym), so,
# like api-inhealth, Talent Atlas BORROWS a slot whose owner does not live on this
# backend host: cubiq (slot 02) runs on 10.10.0.5, leaving 10.10.0.4:18201 free.
# If cubiq ever moves onto 10.10.0.4, this must move first.
#
#   sudo cp /etc/nginx/conf.d/talent.conf{,.bak.$(date +%Y%m%d%H%M%S)}
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate (HTTP-01, own lineage):
#
#   sudo certbot certonly --webroot -w /var/www/acme --cert-name talent \
#     -d talent.mfardiansyah.id --agree-tos --non-interactive \
#     --deploy-hook 'nginx -t && systemctl reload nginx'
#
# On a FIRST install the cert does not exist yet and nginx refuses a missing
# ssl_certificate: comment out the 443 block, reload, run certbot, restore, reload.

# Map names are GLOBAL across conf.d: keep the talent_ prefix.
map $host $talent_backend {
    hostnames;
    talent.mfardiansyah.id  10.10.0.4:18201;
    default                 "";
}

# The app sleeps 400 ms on a wrong password; this caps guessing per client address.
limit_req_zone $binary_remote_addr zone=talent_auth:1m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name talent.mfardiansyah.id;

    # The only path Let's Encrypt has to renew the certificate. Never delete it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.18 on this box: http2 is a listen parameter.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name talent.mfardiansyah.id;

    ssl_certificate     /etc/letsencrypt/live/talent/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talent/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($talent_backend = "") { return 444; }

    # Short HSTS to start; raise after the first automatic renewal succeeds. No preload.
    # The app already sends X-Content-Type-Options, X-Frame-Options and Referrer-Policy.
    add_header Strict-Transport-Security "max-age=300" always;

    # The app caps JSON bodies at 256 KiB itself.
    client_max_body_size 1m;

    # Proxy headers at server level so every location below inherits them.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    limit_req_status 429;

    location = /api/login {
        limit_req zone=talent_auth burst=5 nodelay;
        proxy_pass http://$talent_backend;
    }

    location = /api/setup/owner {
        limit_req zone=talent_auth burst=5 nodelay;
        proxy_pass http://$talent_backend;
    }

    # Plain HTTP over WireGuard to rnd-v2. Nothing is stripped.
    location / {
        proxy_pass http://$talent_backend;
    }
}
